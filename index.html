<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FRAN TECH | Página Inicial</title>

  <meta name="theme-color" content="#080808">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", sans-serif;
      background: #080808;
    }

    .inicio {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      isolation: isolate;
      background: #080808;
    }

    /* IMAGEM GRANDE DE FUNDO */
    .inicio::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;

      background-image: url("./frantech.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      transform: scale(1.02);
    }

    /* CAMADA ESCURA PARA DESTACAR OS TEXTOS */
    .inicio::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.85),
          rgba(0, 0, 0, 0.38),
          rgba(0, 0, 0, 0.75)
        ),
        linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.75),
          transparent 60%
        );
    }

    .conteudo {
      width: min(900px, 90%);
      color: #ffffff;
      animation: aparecer 1.2s ease both;
    }

    .logo {
      display: inline-block;
      margin-bottom: 28px;
      padding: 12px 22px;

      color: #ff8a22;
      background: rgba(255, 106, 0, 0.12);
      border: 1px solid rgba(255, 106, 0, 0.55);
      border-radius: 50px;

      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 4px;
    }

    h1 {
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
      text-shadow: 0 5px 30px rgba(0, 0, 0, 0.65);
    }

    h1 span {
      display: block;
      margin-top: 12px;
      color: #ff6a00;
    }

    .descricao {
      max-width: 650px;
      margin: 28px auto 0;

      color: #eeeeee;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.8;
    }

    .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;

      margin-top: 38px;
      padding: 19px 32px;

      color: #080808;
      background: linear-gradient(135deg, #ffad42, #ff6a00);
      border: none;
      border-radius: 12px;

      font-size: 1rem;
      font-weight: 900;
      text-decoration: none;
      letter-spacing: 1px;

      box-shadow: 0 10px 40px rgba(255, 106, 0, 0.35);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .botao:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 15px 50px rgba(255, 106, 0, 0.55);
    }

    .seta {
      font-size: 1.5rem;
      transition: transform 0.3s;
    }

    .botao:hover .seta {
      transform: translateX(6px);
    }

    .rodape {
      position: absolute;
      bottom: 22px;
      left: 0;
      width: 100%;
      padding: 0 15px;

      color: #cccccc;
      font-size: 0.78rem;
      text-align: center;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      h1 {
        letter-spacing: -2px;
      }

      .logo {
        font-size: 0.72rem;
        letter-spacing: 2px;
      }

      .descricao {
        line-height: 1.7;
      }

      .botao {
        width: 100%;
        max-width: 330px;
        padding: 17px 18px;
        font-size: 0.88rem;
      }

      .rodape {
        bottom: 12px;
        font-size: 0.68rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="inicio">

    <div class="conteudo">

      <div class="logo">
        ASSISTÊNCIA TÉCNICA ESPECIALIZADA
      </div>

      <h1>
        FRAN
        <span>TECH</span>
      </h1>

      <p class="descricao">
        Conserto de eletrodomésticos com cuidado,
        confiança e dedicação.
        Sua solução começa aqui!
      </p>

      <a href="./menu.html" class="botao">
        ENTRAR NO SITE
        <span class="seta" aria-hidden="true">→</span>
      </a>

     


    </div>

    <footer class="rodape">
      © 2026 FRAN TECH — Conserto de Eletrodomésticos
    </footer>

  </main>

</body>
</html>
